services:
  postgres-flow-manager:
    image: postgres:17
    container_name: flow-manager-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flow_manager}
      POSTGRES_USER: ${POSTGRES_USER:-flow_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:?Set DEBEZIUM_PASSWORD in .env}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    volumes:
      - postgres-data-flow-manager:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal-bridge

  flow-manager:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8080"
    environment:
      DB_HOST: ${DB_HOST:-postgres-flow-manager}
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-flow_manager}
      DB_USER: ${POSTGRES_USER:-flow_manager}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-attachments}
      EUREKA_ENDPOINT: ${EUREKA_ENDPOINT:-http://discovery-service:8761/eureka}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_INTERNAL_BOOTSTRAP_SERVERS:-kafka-0:9091}
      KAFKA_OUTPUT_TOPIC: ${KAFKA_OUTPUT_TOPIC:-to-convert}
      KAFKA_INPUT_TOPIC: ${KAFKA_INPUT_TOPIC:-converted}
    depends_on:
      postgres-flow-manager:
        condition: service_healthy
    networks:
      - internal-bridge


  debezium-init-second:
    build:
      context: ./docker/debezium
      dockerfile: Dockerfile.init
    container_name: second-service-debezium-init
    restart: "no"
    depends_on:
      flow-manager:
        condition: service_started

    environment:
      DEBEZIUM_CONNECT_URL: http://debezium:8083
      DEBEZIUM_DB_HOST: ${DB_HOST:-postgres-flow-manager}
      DEBEZIUM_DB_PORT: 5432
      DEBEZIUM_DB_NAME: ${POSTGRES_DB:-flow_manager}
      DEBEZIUM_DB_USER: debezium
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:?Set SECOND_DEBEZIUM_PASSWORD in .env}
      DEBEZIUM_TOPIC_PREFIX: ${DEBEZIUM_TOPIC_PREFIX:-flow-manager}
      KAFKA_OUTPUT_TOPIC: ${KAFKA_OUTPUT_TOPIC:-to-convert}
    volumes:
      - ./docker/debezium:/config:ro
    networks:
      - internal-bridge

volumes:
  postgres-data-flow-manager:

networks:
  internal-bridge:
    name: microservices-training-net
    external: true