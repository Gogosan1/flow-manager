spring:
  application:
    name: "flow-manager"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flow_manager}
    username: ${DB_USER:flow_manager}
    password: ${DB_PASSWORD:flow_manager}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        default_schema: flow_manager
        show-sql: true
        format_sql: true

    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml
    default-schema: flow_manager
    liquibase-schema: public

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    input-topic: ${KAFKA_INPUT_TOPIC:converted}
    output-topic: ${KAFKA_OUTPUT_TOPIC:to-convert}
    subscription-invalidation-topic: ${KAFKA_SUBSCRIPTION_INVALIDATION_TOPIC:subscription-invalidation}

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      group-id: files-converter
      enable-auto-commit: false # false because we are using inbox pattern
      auto-offset-reset: earliest

      properties:
        "[spring.json.value.default.type]": "com.example.flow.manager.event.FileConvertedEvent"
        "[spring.json.trusted.packages]": "com.example.flow.manager.event"
        "[spring.json.use.type.headers]": false

  cache:
    type: redis
    redis:
      time-to-live: 5m
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "${spring.application.name}:"


resilience4j:
  circuitbreaker:
    circuit-breaker-aspect-order: 100
    instances:
      subscriptionService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

  retry:
    retry-aspect-order: 200
    instances:
      subscriptionService:
        max-attempts: 3
        wait-duration: 1000ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_ENDPOINT:http://localhost:8761/eureka}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:attachments}

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  metrics:
    web:
      server:
        request:
          autotime:
            enabled: true
